name: Generar presentación GNOME Honeycomb

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_honeycomb_talk.py"
      - ".github/workflows/build-honeycomb.yml"

permissions:
  contents: write

jobs:
  powerpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia
        run: python -m pip install --disable-pip-version-check python-pptx
      - name: Generar PowerPoint
        run: python scripts/build_honeycomb_talk.py
      - name: Verificar archivo y 26 diapositivas
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pathlib import Path
          import zipfile
          path=Path("GNOME_Honeycomb_Charla_50_Minutos.pptx")
          assert path.is_file() and path.stat().st_size > 15000
          assert len(Presentation(path).slides) == 26
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
          print("PowerPoint verificado:", path, path.stat().st_size, "bytes")
          PY
      - name: Guardar PowerPoint en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GNOME_Honeycomb_Charla_50_Minutos.pptx
          if git diff --cached --quiet; then
            echo "La presentación ya coincide con la versión publicada."
          else
            git commit -m "build: publish GNOME Honeycomb 50-minute PowerPoint"
            git push
          fi
      - name: Conservar copia como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GNOME_Honeycomb_Charla_50_Minutos
          path: GNOME_Honeycomb_Charla_50_Minutos.pptx
